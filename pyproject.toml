[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takapay-guard"
version = "0.1.0.dev0"
description = "Rule-based provenance checks for tool-using AI agents: block sensitive tool calls whose arguments come only from untrusted text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammed Sayed Sameer" }]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Source = "https://github.com/s4m404/takapay-guard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takapay_guard = ["policies/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
